name: Build Android APK
on:
  push:
    paths:
      - 'Lughati-Android-v0.3-AI-Tutor.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and extract project
        run: |
          test -f Lughati-Android-v0.3-AI-Tutor.zip
          unzip -tq Lughati-Android-v0.3-AI-Tutor.zip
          mkdir -p android-project
          unzip -q Lughati-Android-v0.3-AI-Tutor.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile APK
        run: gradle -p android-project --no-daemon assembleDebug --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Lughati-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
